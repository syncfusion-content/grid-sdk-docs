<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Grid</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript Grid Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-base/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-grids/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-treegrid/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-buttons/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-popups/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-navigations/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-dropdowns/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-lists/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-inputs/styles/material.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-calendars/styles/material.css" rel="stylesheet">



    <link href="https://cdn.syncfusion.com/ej2/35.1.1/ej2-splitbuttons/styles/material.css" rel="stylesheet">




    <script src="https://cdn.syncfusion.com/ej2/35.1.1/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
</head>

<body>

    <div class="control-section">
        <div class="content-wrapper">
            <div class="checkboxprop">
                <div class="checkboxmode">
                    <span>
                        Hierarchy Checkbox Mode
                    </span>
                    <div class="checkboxmode"><input type="text" tabindex="1" id="hierarchyModes"></div>
                </div>
            </div>
            <div id="TreeGrid" role="grid" aria-label="Tree Grid"></div>
        </div>
    </div>

    <style>
        .e-bigger.bootstrap5 .e-treegrid .e-hierarchycheckbox .e-frame,
        .e-bigger.bootstrap5-dark .e-treegrid .e-hierarchycheckbox .e-frame,
        .e-bigger.bootstrap4 .e-treegrid .e-hierarchycheckbox .e-frame {
            height: 17px;
            width: 17px;
        }

        .checkboxprop {
            padding-bottom: 5px;
        }

        .checkboxmode {
            display: inline-block;
        }

        .checkboxprop>.checkboxmode {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkboxprop>.checkboxmode>span {
            white-space: nowrap;
        }

        .checkboxprop>.checkboxmode>.checkboxmode {
            flex: 0 0 180px;
            width: 180px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .completed {
            background: #dcfce7;
            color: #15803d;
        }

        .in-progress {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .not-started {
            background: #f3f4f6;
            color: #4b5563;
        }

        .under-review {
            background: #fef3c7;
            color: #b45309;
        }

        .blocked {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
