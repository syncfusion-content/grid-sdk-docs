<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Grid - DOM Virtualization Massive Dataset</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Grid Control with Massive Dataset">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/material3.css" rel="stylesheet" />
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
</head>

<body>
    <div id="container">
        <script id="transactionTemplate" type="text/x-template">
            ${transactionTemplate(data)}
        </script>

        <script id="merchantTemplate" type="text/x-template">
            ${merchantTemplate(data)}
        </script>

        <script id="categoryTemplate" type="text/x-template">
            ${categoryTemplate(data)}
        </script>

        <script id="statusTemplate" type="text/x-template">
            ${statusTemplate(data)}
        </script>
        
        <div id="Grid"></div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
