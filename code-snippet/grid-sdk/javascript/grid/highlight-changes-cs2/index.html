<!DOCTYPE html><html lang="en"><head>
    <title>EJ2 Grid</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Grid Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/material3.css" rel="stylesheet" />
<script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
<script src="es5-datasource.js" type="text/javascript"></script>
</head>
<body>
    <div id="container">
        <div class="controls">
        <label>Color <input type="color" id="color" value="#ffb347"></label>
        <label>Flash duration (ms) <input type="number" id="flash" value="500" min="0" step="100"></label>
        <label>Fade duration (ms) <input type="number" id="fade" value="1000" min="0" step="100"></label>
        <button class="e-btn" id="applySettings">Apply settings</button>
        <button class="e-btn" id="updatePrices">Update prices</button>
        </div>
        <div id="Grid" style="padding: 10px 10px"></div>
    </div>
<script>
var ele = document.getElementById('container');
if(ele) {
  ele.style.visibility = "visible";
}
</script>
<script src="index.js" type="text/javascript"></script>
</body></html>
