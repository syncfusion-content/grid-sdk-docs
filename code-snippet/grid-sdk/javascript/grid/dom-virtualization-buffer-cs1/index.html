<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Grid</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript Grid Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/material3.css" rel="stylesheet" />
    
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
</head>

<body>
    <div id="container">
        <label for="rowBuffer">
                Row Buffer Size: <span id="bufferValue">5</span>
            </label>
            <div id="rowBuffer" style="width: 300px;"></div>
        <div id="Grid"></div>

        <script id="skuTemplate" type="text/x-template">
                ${skuTemplate(data)}
            </script>

            <script id="productTemplate" type="text/x-template">
                ${productTemplate(data)}
            </script>

            <script id="categoryTemplate" type="text/x-template">
                ${categoryTemplate(data)}
            </script>

            <script id="stockTemplate" type="text/x-template">
                ${stockTemplate(data)}
            </script>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
