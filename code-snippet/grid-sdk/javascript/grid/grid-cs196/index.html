<!DOCTYPE html><html lang="en"><head>
    <title>EJ2 Grid</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript Grid Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/material3.css" rel="stylesheet" />
<script src="https://cdn.syncfusion.com/ej2/34.2.2/dist/ej2.min.js" type="text/javascript"></script>
<script src="es5-datasource.js" type="text/javascript"></script>
</head>
<body>
    
    <div id="container">
        <div style="padding-bottom: 10px">
            <div style="padding: 10px 0px 20px 0px">
              <button id="selectcell1">Select [1, 3]</button>
              <button id="selectcell2">Select [2, 2]</button>
              <button id="selectcell3">Select [0, 0]</button></div>
            <div style="padding: 10px 0px 20px 0px">
              <button id="selectcell4">Select [4, 2]</button>
              <button id="selectcell5">Select [5, 1]</button>
              <button id="selectcell6">Select [3, 3]</button></div>
            <div style="padding: 10px 0px 20px 0px">
              <button id="selectcell7">Select [0, 3]</button>
              <button id="selectcell8">Select [8, 1]</button>
              <button id="selectcell9">Select [8, 2]</button></div>
          <div style="padding: 20px 0px 0px 0px">
        <div id="Grid"></div>
    </div>

<script>
var ele = document.getElementById('container');
if(ele) {
  ele.style.visibility = "visible";
}   
      </script>
<script src="index.js" type="text/javascript"></script>
</body></html>
